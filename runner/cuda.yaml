# Primus CLI NVIDIA GPU Configuration
# Use this config for running Primus on NVIDIA GPUs (e.g., H100, A100).
#
# This file is automatically merged on top of .primus.yaml when the runner
# detects NVIDIA GPUs (nvidia-smi present and rocm-smi absent) OR when the
# training config contains `target_gpu: cuda` OR when a bare arg
# `target_gpu=cuda` is passed to the Primus Python CLI.
#
# Manual override (still supported):
#   ./primus-cli --config runner/cuda.yaml container -- train pretrain --config ...
#
# Note: MaxText/JAX requires a separate JAX+CUDA container image (not covered here).

# Marks this runner config as CUDA-targeted so shell scripts can read it.
target_gpu: cuda

container:
  options:
    image: "primus/cuda:latest"

    ipc: "host"
    network: "host"
    name: "primus-training-cuda"

    # NVIDIA GPU access via --gpus (replaces ROCm --device flags)
    gpus: "all"
    device: []

    cap-add:
      - "SYS_PTRACE"

    env:
      - "MASTER_ADDR"
      - "MASTER_PORT"
      - "NNODES"
      - "NODE_RANK"
      - "GPUS_PER_NODE"
      - "TARGET_GPU"
      - "WANDB_API_KEY"
      - "HF_TOKEN"
      - "NCCL_IB_HCA"
      - "NCCL_SOCKET_IFNAME"
      - "GLOO_SOCKET_IFNAME"

direct:
  master_port: 1234
  nnodes: 1
  master_addr: "localhost"
  run_mode: "torchrun"
  script: "primus/cli/main.py"
  numa: "false"
  env:
    - "NCCL_SOCKET_IFNAME=lo"
    - "GLOO_SOCKET_IFNAME=lo"
    - "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True"
