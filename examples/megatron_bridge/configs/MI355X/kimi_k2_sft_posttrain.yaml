work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:kimi_k2_sft_posttrain_mi355x}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  post_trainer:
    framework: megatron_bridge
    config: sft_trainer.yaml

    model: kimi_k2.yaml

    overrides:
      stderr_sink_level: DEBUG

      # ===== Checkpoint Loading =====
      # Will be auto-set by pre-training hook after HF → Megatron conversion
      pretrained_checkpoint: null

      # Fine-tuning method: full SFT (all weights updated)
      peft: "none"

      # ===== Model sub-config (cfg.model.*) =====
      model:
        # Parallelism: Full Model (1024 GPUs = TP=2 x PP=16 x EP=32)
        tensor_model_parallel_size: 2
        pipeline_model_parallel_size: 16
        pipeline_dtype: bfloat16
        virtual_pipeline_model_parallel_size: null
        context_parallel_size: 1
        sequence_parallel: true
        expert_model_parallel_size: 32
        expert_tensor_parallel_size: 1

        # MoE Token Dispatcher
        moe_token_dispatcher_type: alltoall
        moe_enable_deepep: true
        moe_shared_expert_overlap: false

        # MoE Kernel Optimizations
        moe_router_fusion: false
        moe_permute_fusion: true
        moe_grouped_gemm: true
        cross_entropy_loss_fusion: true
        cross_entropy_fusion_impl: "te"

        # Transformer Engine & Attention
        transformer_impl: "transformer_engine"
        attention_backend: null

        # CUDA Graph
        cuda_graph_impl: "none"
        cuda_graph_scope: "full"
        cuda_graph_warmup_steps: 3

        # Recompute
        recompute_granularity: full
        recompute_method: uniform
        recompute_num_layers: 1

        # Memory
        fine_grained_activation_offloading: false
        offload_modules: null

      # ===== Training sub-config (cfg.train.*) =====
      train:
        train_iters: 150000
        global_batch_size: 4096
        micro_batch_size: 1
        manual_gc: true
        manual_gc_interval: 5
        manual_gc_eval: 5

      # ===== Optimizer sub-config =====
      finetune_lr: 5.0e-6
      min_lr: 0.0

      # ===== Checkpoint sub-config (cfg.checkpoint.*) =====
      checkpoint:
        pretrained_checkpoint: null
        finetune: true
        save_interval: 2000
        async_save: false

      # ===== Dataset sub-config (cfg.dataset.*) =====
      dataset:
        seq_length: 4096
        num_workers: 8

      # ===== Validation sub-config (cfg.validation.*) =====
      validation:
        eval_iters: 0
        eval_interval: 2000

      # ===== Scheduler sub-config (cfg.scheduler.*) =====
      scheduler:
        lr_warmup_iters: 2000
        lr_decay_iters: 150000

      # ===== W&B logging =====
      wandb_project: null
      wandb_entity: null
      wandb_exp_name: null

      # ===== DDP sub-config (cfg.ddp.*) =====
      ddp:
        use_distributed_optimizer: false
        overlap_param_gather: false
        overlap_grad_reduce: true
        check_for_nan_in_grad: true
        average_in_collective: true
        use_megatron_fsdp: false

      # ===== Communication Overlap sub-config (cfg.comm_overlap.*) =====
      comm_overlap:
        tp_comm_overlap: false
        delay_wgrad_compute: false
        overlap_moe_expert_parallel_comm: false
