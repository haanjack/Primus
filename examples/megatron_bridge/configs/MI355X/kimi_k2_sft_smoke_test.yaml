work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:kimi_k2_sft_smoke_test_mi355x}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  post_trainer:
    framework: megatron_bridge
    config: sft_trainer.yaml

    model: kimi_k2.yaml

    overrides:
      stderr_sink_level: DEBUG

      # ===== Checkpoint Loading =====
      # null = random init; hook skips conversion when pretrained_checkpoint=null
      pretrained_checkpoint: null

      # ===== Model sub-config (cfg.model.*) =====
      model:
        # Parallelism: EP=8 to distribute 384 experts across 8 GPUs
        # Reduce num_layers to 2 (from 61) so the model fits in 8×192GB for smoke test
        # Production scale requires 1024+ GPUs (TP=2, PP=16, EP=32)
        tensor_model_parallel_size: 1
        pipeline_model_parallel_size: 1
        virtual_pipeline_model_parallel_size: null
        pipeline_model_parallel_layout: null
        context_parallel_size: 1
        sequence_parallel: false
        expert_model_parallel_size: 8
        expert_tensor_parallel_size: 1

        # Reduce num_layers for smoke test to fit in GPU memory
        # moe_layer_freq must match num_layers (HF config has 61-entry list)
        num_layers: 2
        moe_layer_freq: [0, 1]

        # MoE Dispatcher: EP>1 requires alltoall
        moe_token_dispatcher_type: alltoall
        moe_enable_deepep: false
        moe_shared_expert_overlap: false

        # Disable TE triton-based MoE permutation (get_int_dtype Triton JIT error)
        moe_permute_fusion: false

        # No activation offloading needed with reduced layers
        fine_grained_activation_offloading: false
        offload_modules: null

        # Recompute
        recompute_granularity: full
        recompute_method: uniform
        recompute_num_layers: 1

        # Disable CUDA graph for smoke test
        # cuda_graph_scope must be null (not "") to avoid KeyError in CudaGraphScope enum
        cuda_graph_impl: "none"
        cuda_graph_scope: null
        cuda_graph_warmup_steps: 0

      # ===== Training sub-config (cfg.train.*) =====
      train:
        train_iters: 5
        global_batch_size: 8
        micro_batch_size: 1
        manual_gc: true
        manual_gc_interval: 5

      # ===== Checkpoint sub-config (cfg.checkpoint.*) =====
      checkpoint:
        pretrained_checkpoint: null
        finetune: false
        # Disable checkpoint saving for smoke test
        # (avoids nvidia_resiliency_ext version mismatch in the container)
        save: null
        save_interval: 10000

      # ===== Dataset sub-config (cfg.dataset.*) =====
      dataset:
        seq_length: 1024
        num_workers: 2
        mock: true

      # ===== Validation sub-config (cfg.validation.*) =====
      validation:
        eval_iters: 0
        eval_interval: 10000

      # ===== Scheduler sub-config (cfg.scheduler.*) =====
      scheduler:
        lr_warmup_iters: 0
        lr_decay_iters: 5
